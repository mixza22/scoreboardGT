<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gifted Leaderboard</title>

<style>
  * { box-sizing: border-box; }

  :root {
    --emerald: #00ffcc;
    --text-main: #f8fafc;
    --text-soft: #cbd5e1;
    --text-muted: #94a3b8;
    --border: rgba(255,255,255,.10);
  }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: var(--text-main);
    padding: 18px;
    background:
      radial-gradient(circle at 18% 16%, rgba(0,255,204,.13), transparent 34%),
      radial-gradient(circle at 85% 22%, rgba(56,189,248,.12), transparent 36%),
      linear-gradient(135deg, #020617, #000 55%, #031b18);
    overflow-x: hidden;
  }

  .phone-board {
    max-width: 430px;
    margin: auto;
    min-height: calc(100vh - 36px);
    padding: 22px 18px;
    border-radius: 36px;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(15,23,42,.86), rgba(2,6,23,.92)),
      radial-gradient(circle at 50% 0%, rgba(0,255,204,.13), transparent 34%);
    border: 1px solid var(--border);
    box-shadow: 0 35px 90px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(26px);
  }

  .phone-board::before {
    content: "";
    position: absolute;
    inset: -80px;
    background:
      linear-gradient(120deg, transparent 20%, rgba(0,255,204,.08), transparent 42%),
      radial-gradient(circle at 50% 25%, rgba(0,255,204,.12), transparent 32%);
    pointer-events: none;
  }

  .phone-board::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: linear-gradient(to bottom, black, transparent 70%);
    pointer-events: none;
  }

  .topbar, .hero-title, .search-box, .podium, .content-panel {
    position: relative;
    z-index: 1;
  }

  .topbar {
    display: grid;
    grid-template-columns: 1fr;
    justify-items: center;
    align-items: center;
    gap: 10px;
  }

  .brand-center {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .gang-logo {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background: #020617;
    border: 2px solid rgba(0,255,204,.30);
    animation: logoPulse 2.8s ease-in-out infinite;
  }

  @keyframes logoPulse {
    0%,100% { box-shadow: 0 0 16px rgba(0,255,204,.22); }
    50% { box-shadow: 0 0 34px rgba(0,255,204,.50); }
  }

  .brand {
    font-weight: 900;
    font-size: 21px;
    letter-spacing: 1px;
    color: var(--text-main);
    text-shadow: 0 0 14px rgba(0,255,204,.18);
    white-space: nowrap;
  }

  .top-actions {
    position: absolute;
    right: 0;
    top: 1px;
  }

  .coin {
    background: rgba(2,6,23,.68);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 900;
    color: var(--text-soft);
  }

  .coin span {
    color: white;
    margin-left: 4px;
  }

  .hero-title {
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .hero-title h1 {
    margin: 0;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -.8px;
  }

  .hero-title a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
  }

  .hero-title a:hover {
    color: var(--emerald);
  }

  .search-box {
    margin-top: 14px;
  }

  input {
    width: 100%;
    padding: 12px 15px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(2,6,23,.78);
    color: white;
    outline: none;
    font-size: 15px;
  }

  input::placeholder {
    color: rgba(203,213,225,.48);
  }

  input:focus {
    border-color: rgba(0,255,204,.55);
    box-shadow: 0 0 22px rgba(0,255,204,.18);
  }

  .podium {
    margin: 26px 0 24px;
    min-height: 145px;
    display: grid;
    grid-template-columns: 1fr 1.25fr 1fr;
    align-items: end;
    gap: 8px;
  }

  .podium-card {
    text-align: center;
    position: relative;
  }

  .podium-card:nth-child(1) { transform: translateY(20px); }
  .podium-card.top { transform: translateY(0); }
  .podium-card:nth-child(3) { transform: translateY(24px); }

  .avatar {
    width: 68px;
    height: 68px;
    margin: auto;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #020617, #1f2937, #475569);
    border: 2px solid rgba(203,213,225,.85);
    font-size: 26px;
    font-weight: 900;
    box-shadow: 0 16px 35px rgba(0,0,0,.35), 0 0 20px rgba(148,163,184,.18);
    position: relative;
    overflow: hidden;
  }

  .podium-card.top .avatar {
    width: 108px;
    height: 108px;
    border-color: var(--emerald);
    background: linear-gradient(135deg, #020617, #064e3b, #00ffcc);
    box-shadow: 0 0 18px rgba(0,255,204,.38), 0 0 42px rgba(0,255,204,.18);
    animation: winnerGlow 2.5s ease-in-out infinite;
  }

  @keyframes winnerGlow {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .avatar img,
  .mini-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }

  .crown {
    position: absolute;
    top: -23px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 21px;
    z-index: 4;
    filter: drop-shadow(0 0 8px rgba(0,255,204,.45));
  }

  .badge {
    position: absolute;
    bottom: -9px;
    left: 50%;
    transform: translateX(-50%);
    width: 25px;
    height: 25px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #eafffb;
    color: #031b18;
    font-size: 12px;
    font-weight: 900;
    z-index: 5;
  }

  .podium-name {
    margin-top: 14px;
    font-size: 12px;
    font-weight: 900;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .podium-card.top .podium-name {
    font-size: 14px;
    color: white;
    text-shadow: 0 0 12px rgba(0,255,204,.25);
  }

  .podium-score {
    margin-top: 4px;
    font-size: 12px;
    color: var(--emerald);
    font-weight: 900;
  }

  .content-panel {
    margin-top: 4px;
    padding: 12px;
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(2,6,23,.66), rgba(2,6,23,.42));
    border: 1px solid rgba(255,255,255,.07);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 18px 45px rgba(0,0,0,.24);
    backdrop-filter: blur(16px);
  }

  .rank-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-radius: 16px;
    margin-bottom: 12px;
    background:
      linear-gradient(90deg, rgba(0,255,204,.14), rgba(255,255,255,.06)),
      rgba(15,23,42,.72);
    border: 1px solid rgba(0,255,204,.20);
    position: relative;
    overflow: hidden;
  }

  .rank-banner span {
    font-size: 13px;
    color: var(--text-soft);
    font-weight: 900;
  }

  .rank-banner b {
    font-size: 18px;
    color: white;
    text-shadow: 0 0 12px rgba(0,255,204,.35);
  }

  .leaderboard-list {
    max-height: 40vh;
    overflow-y: auto;
    padding-right: 3px;
  }

  .leaderboard-list::-webkit-scrollbar {
    width: 6px;
  }

  .leaderboard-list::-webkit-scrollbar-thumb {
    background: rgba(0,255,204,.22);
    border-radius: 999px;
  }

  .player {
    display: grid;
    grid-template-columns: 48px 1fr 42px 28px;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    margin-bottom: 8px;
    border-radius: 16px;
    background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.015));
    border: 1px solid rgba(255,255,255,.06);
    transition: .18s ease;
    backdrop-filter: blur(10px);
  }

  .player:hover {
    background: linear-gradient(90deg, rgba(0,255,204,.14), rgba(255,255,255,.025));
    border-color: rgba(0,255,204,.28);
    transform: translateY(-1px) scale(1.01);
    box-shadow: 0 10px 28px rgba(0,0,0,.32);
  }

  .player.top1 {
    border-color: rgba(0,255,204,.42);
    box-shadow: 0 0 18px rgba(0,255,204,.16);
  }

  .player.top2 { border-color: rgba(203,213,225,.24); }
  .player.top3 { border-color: rgba(148,163,184,.20); }

  .mini-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #020617, #1f2937, #334155);
    border: 2px solid rgba(255,255,255,.11);
    overflow: hidden;
  }

  .player.top1 .mini-avatar {
    border-color: rgba(0,255,204,.55);
    box-shadow: 0 0 18px rgba(0,255,204,.22);
  }

  .name {
    font-size: 15px;
    font-weight: 900;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sub {
    margin-top: 3px;
    font-size: 10px;
    color: var(--text-muted);
  }

  .score {
    text-align: right;
    font-size: 18px;
    font-weight: 900;
    color: var(--text-main);
    transition: .2s;
  }

  .player.top1 .score {
    color: var(--emerald);
    text-shadow: 0 0 12px rgba(0,255,204,.55);
  }

  .trend {
    width: 23px;
    height: 23px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.06);
    color: var(--text-soft);
    font-size: 11px;
    font-weight: 900;
  }

  .player.top1 .trend {
    background: rgba(0,255,204,.12);
    color: var(--emerald);
    border-color: rgba(0,255,204,.22);
  }

  .empty {
    text-align: center;
    color: rgba(255,255,255,.55);
    padding: 36px 10px;
  }

  @media (max-width: 480px) {
    body { padding: 0; }

    .phone-board {
      max-width: none;
      min-height: 100vh;
      border-radius: 0;
      padding: 22px 17px;
    }

    .podium {
      margin-top: 24px;
      margin-bottom: 22px;
    }

    .leaderboard-list {
      max-height: 42vh;
    }
  }
</style>
</head>

<body>
  <div class="phone-board">
    <div class="topbar">
      <div></div>

      <div class="brand-center">
        <img class="gang-logo" src="gang-logo.png" alt="Gang Logo" />
        <div class="brand">GIFTED</div>
      </div>

      <div class="top-actions">
        <div class="coin">คะแนน <span id="totalScore">0</span></div>
      </div>
    </div>

    <div class="hero-title">
      <h1>Leaderboard</h1>
      <a href="admin.html">Admin</a>
    </div>

    <div class="search-box">
      <input id="searchInput" placeholder="🔍 ค้นหาชื่อ..." oninput="render()" />
    </div>

    <div id="podium" class="podium"></div>

    <div class="content-panel">
      <div class="rank-banner">
        <span>จำนวนผู้เล่นทั้งหมด</span>
        <b id="totalPlayers">0</b>
      </div>

      <div id="list" class="leaderboard-list"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxuf93a0mwC0gAf5xboU1_4Nk6WoBoREZIh40OqP7guGDpDykBUJIdFvcCpZAtXEucdpg/exec";

    let players = [];
    let isLoading = false;

    function makeId() {
      return "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
    }

    function normalizePlayers(list) {
      return list
        .filter(p => p && typeof p.name === "string")
        .map(p => ({
          id: String(p.id || makeId()),
          name: p.name.trim(),
          score: Number.isFinite(Number(p.score)) ? Number(p.score) : 0,
          avatar: String(p.avatar || "").trim()
        }))
        .filter(p => p.name.length > 0);
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function avatarHtml(url) {
      if (!url) return "👤";

      const safeUrl = escapeHtml(url);

      return `
        <img 
          src="${safeUrl}" 
          alt="avatar"
          loading="lazy"
          onerror="this.remove(); this.parentElement.textContent='👤';"
        />
      `;
    }

    async function loadPlayers(silent = false) {
      try {
        if (!silent) {
          isLoading = true;
          render();
        }

        const res = await fetch(API_URL + "?t=" + Date.now());
        const data = await res.json();

        if (!data.ok) throw new Error(data.error || "โหลดข้อมูลไม่สำเร็จ");

        players = normalizePlayers(data.players || []);
        localStorage.setItem("gifted_players_backup", JSON.stringify(players));
      } catch (err) {
        const backup = JSON.parse(localStorage.getItem("gifted_players_backup") || "[]");

        if (backup.length) {
          players = normalizePlayers(backup);
        } else {
          document.getElementById("list").innerHTML =
            `<div class="empty">โหลดข้อมูลไม่สำเร็จ: ${escapeHtml(err.message)}</div>`;
        }
      } finally {
        isLoading = false;
        render();
      }
    }

    function sortPlayers() {
      players.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
    }

    function renderPodium(sorted) {
      const podium = document.getElementById("podium");

      if (sorted.length === 0) {
        podium.innerHTML = "";
        return;
      }

      const first = sorted[0];
      const second = sorted[1];
      const third = sorted[2];

      podium.innerHTML = `
        ${second ? podiumCard(second, 2, false) : `<div></div>`}
        ${first ? podiumCard(first, 1, true) : `<div></div>`}
        ${third ? podiumCard(third, 3, false) : `<div></div>`}
      `;
    }

    function podiumCard(player, rank, isTop) {
      return `
        <div class="podium-card ${isTop ? "top" : ""}">
          <div class="avatar">
            ${isTop ? `<div class="crown">👑</div>` : ""}
            ${avatarHtml(player.avatar)}
            <div class="badge">${rank}</div>
          </div>
          <div class="podium-name">${escapeHtml(player.name)}</div>
          <div class="podium-score">${player.score}</div>
        </div>
      `;
    }

    function render() {
      sortPlayers();

      const totalScore = players.reduce((sum, p) => sum + p.score, 0);
      document.getElementById("totalPlayers").textContent = players.length;
      document.getElementById("totalScore").textContent = totalScore;

      const list = document.getElementById("list");
      const keyword = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();

      const sorted = [...players].sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
      renderPodium(sorted);

      const filteredPlayers = sorted.filter(p =>
        !keyword || p.name.toLowerCase().includes(keyword)
      );

      list.innerHTML = "";

      if (isLoading) {
        list.innerHTML = `<div class="empty">กำลังโหลดข้อมูลจาก Google Sheet...</div>`;
        return;
      }

      if (players.length === 0) {
        list.innerHTML = `<div class="empty">ยังไม่มีรายชื่อ</div>`;
        return;
      }

      if (filteredPlayers.length === 0) {
        list.innerHTML = `<div class="empty">ไม่เจอรายชื่อที่ค้นหา</div>`;
        return;
      }

      filteredPlayers.forEach((p) => {
        const rank = sorted.findIndex(player => player.id === p.id) + 1;

        const topClass =
          rank === 1 ? "top1" :
          rank === 2 ? "top2" :
          rank === 3 ? "top3" : "";

        const arrow = rank <= 3 ? "▲" : "•";

        list.innerHTML += `
          <div class="player ${topClass}">
            <div class="mini-avatar">${avatarHtml(p.avatar)}</div>
            <div>
              <div class="name">${escapeHtml(p.name)}</div>
              <div class="sub">Rank #${rank}</div>
            </div>
            <div class="score">${p.score}</div>
            <div class="trend">${arrow}</div>
          </div>
        `;
      });
    }

    render();
    loadPlayers();

    setInterval(() => {
      if (!isLoading && !document.hidden) loadPlayers(true);
    }, 120000);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && !isLoading) loadPlayers(true);
    });
  </script>
</body>
</html>
