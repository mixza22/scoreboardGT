<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gifted Scoreboard</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient(circle at top, #312e81 0%, #111827 38%, #020617 100%); color: #fff; min-height: 100vh; padding: 14px; }
    .app { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 14px; }
    .title h1 { margin: 0; font-size: 32px; letter-spacing: 0.5px; }
    .title p { margin: 6px 0 0; color: #9ca3af; }
    .admin-link { color: #9ca3af; text-decoration: none; font-size: 12px; opacity: .55; }
    .admin-link:hover { opacity: 1; color: #c7d2fe; }
    .card { background: rgba(17, 24, 39, 0.88); border: 1px solid rgba(255,255,255,.08); border-radius: 22px; padding: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.35); margin-bottom: 12px; backdrop-filter: blur(14px); }
    input { width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.12); background: #020617; color: white; outline: none; font-size: 15px; }
    input:focus { border-color: #6366f1; }
    button { border: 0; border-radius: 14px; padding: 10px 13px; color: white; font-weight: 800; cursor: pointer; background: #374151; transition: .15s; white-space: nowrap; }
    button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat-box { background: #020617; border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 16px; }
    .stat-label { color: #9ca3af; font-size: 13px; }
    .stat-value { font-size: 26px; font-weight: 900; margin-top: 6px; }
    .board-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #d1d5db; font-size: 14px; gap: 10px; }
    .player { display: grid; grid-template-columns: 60px 1fr 110px; align-items: center; gap: 12px; background: #020617; border: 1px solid rgba(255,255,255,.08); padding: 12px; border-radius: 16px; margin-bottom: 9px; position: relative; transition: .15s; }
    .player:hover { transform: translateY(-2px); border-color: rgba(99,102,241,.45); box-shadow: 0 0 20px rgba(124,58,237,.20); }
    .rank { font-size: 24px; font-weight: 900; text-align: center; }
    .name { font-size: 18px; font-weight: 900; }
    .sub { color: #9ca3af; font-size: 12px; margin-top: 4px; }
    .score { justify-self: end; font-size: 23px; font-weight: 900; color: #c7d2fe; background: linear-gradient(135deg, #7c3aed33, #06b6d433); border: 1px solid rgba(255,255,255,.1); padding: 8px 15px; border-radius: 999px; min-width: 64px; text-align: center; }
    .empty { text-align: center; color: #9ca3af; padding: 38px 10px; }
    .leaderboard-list { max-height: 68vh; overflow-y: auto; padding-right: 4px; }
    .leaderboard-list::-webkit-scrollbar { width: 8px; }
    .leaderboard-list::-webkit-scrollbar-thumb { background: #374151; border-radius: 999px; }
    .top1 { border-color: rgba(250,204,21,.9); border-left: 5px solid #facc15; background: linear-gradient(90deg, rgba(250,204,21,.18), #020617); transform: scale(1.01); animation: crownGlow 2.4s ease-in-out infinite; }
    .top1 .name::before { content: "👑 "; }
    .top2 { border-left: 5px solid #d1d5db; background: linear-gradient(90deg, rgba(209,213,219,.11), #020617); }
    .top3 { border-left: 5px solid #b45309; background: linear-gradient(90deg, rgba(180,83,9,.14), #020617); }
    @keyframes crownGlow { 0%,100% { box-shadow: 0 0 18px rgba(250,204,21,.14); } 50% { box-shadow: 0 0 36px rgba(250,204,21,.34); } }
    @media (max-width: 760px) {
      .header, .board-title { display: grid; grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .player { grid-template-columns: 52px 1fr 88px; }
      .title h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">
        <h1>🏆 Gifted Scoreboard</h1>
        <p>จดคะแนน Loop</p>
      </div>
      <a class="admin-link" href="admin.html">Admin</a>
    </div>

    <div class="card stats">
      <div class="stat-box"><div class="stat-label">จำนวนผู้เล่น</div><div class="stat-value" id="totalPlayers">0</div></div>
      <div class="stat-box"><div class="stat-label">คะแนนรวม</div><div class="stat-value" id="totalScore">0</div></div>
      <div class="stat-box"><div class="stat-label">อันดับ 1 ตอนนี้</div><div class="stat-value" id="topPlayer">-</div></div>
    </div>

    <div class="card">
      <div class="board-title">
        <input id="searchInput" placeholder="🔍 ค้นหาชื่อ..." style="max-width:220px; padding:8px 12px;" oninput="render()" />
        <b>Leaderboard</b>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <span id="sortLabel">เรียง: คะแนน (มาก→น้อย)</span>
          <button onclick="setSort('score_desc')">คะแนน↓</button>
          <button onclick="setSort('score_asc')">คะแนน↑</button>
          <button onclick="setSort('name_asc')">A→Z</button>
          <button onclick="setSort('name_desc')">Z→A</button>
        </div>
      </div>
      <div id="list" class="leaderboard-list"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxuf93a0mwC0gAf5xboU1_4Nk6WoBoREZIh40OqP7guGDpDykBUJIdFvcCpZAtXEucdpg/exec";
    let players = [];
    let sortMode = localStorage.getItem("gifted_sort_mode") || "score_desc";
    let isLoading = false;

    function makeId() { return "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8); }
    function normalizePlayers(list) {
      return list
        .filter(p => p && typeof p.name === "string")
        .map(p => ({ id: String(p.id || makeId()), name: p.name.trim(), score: Number.isFinite(Number(p.score)) ? Number(p.score) : 0 }))
        .filter(p => p.name.length > 0);
    }
    function setLoading(value) { isLoading = value; }
    async function loadPlayers(silent = false) {
      try {
        if (!silent) { setLoading(true); render(); }
        const res = await fetch(API_URL + "?t=" + Date.now());
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "โหลดข้อมูลไม่สำเร็จ");
        players = normalizePlayers(data.players || []);
        localStorage.setItem("gifted_players_backup", JSON.stringify(players));
      } catch (err) {
        const backup = JSON.parse(localStorage.getItem("gifted_players_backup") || "[]");
        if (backup.length) players = normalizePlayers(backup);
        else if (!silent) document.getElementById("list").innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ: ${escapeHtml(err.message)}</div>`;
      } finally {
        if (!silent) setLoading(false);
        render();
      }
    }
    function getRankIcon(index) { if (index === 0) return "🥇"; if (index === 1) return "🥈"; if (index === 2) return "🥉"; return `#${index + 1}`; }
    function sortPlayers() {
      if (sortMode === "score_desc") players.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
      else if (sortMode === "score_asc") players.sort((a, b) => a.score - b.score || a.name.localeCompare(b.name));
      else if (sortMode === "name_asc") players.sort((a, b) => a.name.localeCompare(b.name));
      else if (sortMode === "name_desc") players.sort((a, b) => b.name.localeCompare(a.name));
    }
    function render() {
      sortPlayers(); updateSortLabel();
      document.getElementById("totalPlayers").textContent = players.length;
      document.getElementById("totalScore").textContent = players.reduce((sum, p) => sum + p.score, 0);
      document.getElementById("topPlayer").textContent = players.length ? [...players].sort((a, b) => b.score - a.score)[0].name : "-";
      const list = document.getElementById("list");
      const keyword = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();
      const filteredPlayers = players.filter(p => !keyword || p.name.toLowerCase().includes(keyword));
      list.innerHTML = "";
      if (isLoading) { list.innerHTML = `<div class="empty">กำลังโหลดข้อมูลจาก Google Sheet...</div>`; return; }
      if (players.length === 0) { list.innerHTML = `<div class="empty">ยังไม่มีรายชื่อ</div>`; return; }
      if (filteredPlayers.length === 0) { list.innerHTML = `<div class="empty">ไม่เจอรายชื่อที่ค้นหา</div>`; return; }
      filteredPlayers.forEach((p) => {
        const realRank = players.findIndex(player => player.id === p.id);
        const topClass = realRank === 0 ? "top1" : realRank === 1 ? "top2" : realRank === 2 ? "top3" : "";
        list.innerHTML += `
          <div class="player ${topClass}">
            <div class="rank">${getRankIcon(realRank)}</div>
            <div><div class="name">${escapeHtml(p.name)}</div><div class="sub">ข้อมูลกลางจาก Google Sheet</div></div>
            <div class="score">${p.score}</div>
          </div>`;
      });
    }
    function setSort(mode) { sortMode = mode; localStorage.setItem("gifted_sort_mode", sortMode); render(); }
    function updateSortLabel() {
      const label = document.getElementById("sortLabel");
      if (!label) return;
      const map = { score_desc: "คะแนน (มาก→น้อย)", score_asc: "คะแนน (น้อย→มาก)", name_asc: "ชื่อ (A→Z)", name_desc: "ชื่อ (Z→A)" };
      label.textContent = "เรียง: " + (map[sortMode] || "คะแนน (มาก→น้อย)");
    }
    function escapeHtml(text) { const div = document.createElement("div"); div.textContent = text; return div.innerHTML; }

    render();
    loadPlayers();

    setInterval(() => {
      if (!isLoading && !document.hidden) loadPlayers(true);
    }, 120000);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && !isLoading) loadPlayers(true);
    });
  </script>
</body>
</html>
