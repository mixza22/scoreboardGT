<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gifted Leaderboard</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-main: #020617;
      --bg-soft: #0b0f19;
      --bg-card: #111827;
      --bg-hover: #1f2937;
      --border: rgba(255,255,255,.10);
      --border-strong: rgba(255,255,255,.22);
      --text-main: #f9fafb;
      --text-soft: #d1d5db;
      --text-muted: #9ca3af;
      --silver: #e5e7eb;
      --grey: #6b7280;
      --dark-grey: #374151;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 8%, rgba(255,255,255,.08), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(156,163,175,.10), transparent 34%),
        linear-gradient(135deg, #000000, #020617 48%, #111827);
      color: var(--text-main);
      padding: 18px;
    }

    .phone-board {
      max-width: 430px;
      margin: auto;
      min-height: calc(100vh - 36px);
      background:
        radial-gradient(circle at top, rgba(255,255,255,.06), transparent 35%),
        linear-gradient(180deg, #111827, #070b13 58%, #020617);
      border-radius: 36px;
      padding: 24px 18px;
      box-shadow: 0 30px 80px rgba(0,0,0,.65);
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      backdrop-filter: blur(20px);
    }

    .phone-board::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, transparent 20%, rgba(255,255,255,.045), transparent 45%),
        radial-gradient(circle at 50% 25%, rgba(255,255,255,.08), transparent 28%);
      pointer-events: none;
    }

    .topbar, .hero-title, .rank-banner, .player, .podium, .search-box {
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .gang-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-main);
      border: 2px solid var(--border-strong);
      animation: logoPulse 2.8s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 14px rgba(255,255,255,.10); }
      50% { box-shadow: 0 0 28px rgba(255,255,255,.26); }
    }

    .brand {
      font-weight: 900;
      font-size: 22px;
      color: var(--silver);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .coin {
      background: rgba(17,24,39,.92);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 13px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-soft);
    }

    .hero-title {
      margin-top: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-title h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1;
      color: var(--text-main);
    }

    .hero-title a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
    }

    .hero-title a:hover {
      color: white;
    }

    .search-box {
      margin-top: 16px;
    }

    input {
      width: 100%;
      padding: 13px 15px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(2,6,23,.85);
      color: white;
      outline: none;
      font-size: 15px;
    }

    input::placeholder {
      color: rgba(255,255,255,.42);
    }

    input:focus {
      border-color: var(--silver);
      box-shadow: 0 0 18px rgba(255,255,255,.08);
    }

    .podium {
      margin: 34px 0 26px;
      display: grid;
      grid-template-columns: 1fr 1.25fr 1fr;
      align-items: end;
      gap: 8px;
    }

    .podium-card {
      text-align: center;
    }

    .avatar {
      width: 76px;
      height: 76px;
      margin: auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #111827, #374151, #6b7280);
      border: 3px solid rgba(229,231,235,.75);
      font-size: 30px;
      font-weight: 900;
      box-shadow: 0 0 24px rgba(255,255,255,.10);
      position: relative;
    }

    .podium-card.top .avatar {
      width: 118px;
      height: 118px;
      border-color: #f9fafb;
      background: linear-gradient(135deg, #000000, #374151, #9ca3af);
      animation: topGlow 2.6s ease-in-out infinite;
    }

    @keyframes topGlow {
      0%, 100% {
        box-shadow: 0 0 28px rgba(255,255,255,.18);
        transform: translateY(0);
      }
      50% {
        box-shadow: 0 0 52px rgba(255,255,255,.34);
        transform: translateY(-3px);
      }
    }

    .crown {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      filter: grayscale(1);
    }

    .badge {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--silver);
      color: #111827;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 900;
    }

    .podium-name {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-soft);
    }

    .podium-score {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 900;
    }

    .rank-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 17px 20px;
      border-radius: 20px;
      background: linear-gradient(90deg, #020617, #1f2937, #374151);
      font-weight: 900;
      margin-bottom: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,.34);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .rank-banner::after {
      content: "";
      position: absolute;
      top: 0;
      left: -80%;
      width: 55%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      animation: shine 3.2s ease-in-out infinite;
    }

    @keyframes shine {
      0% { left: -80%; }
      55%, 100% { left: 130%; }
    }

    .rank-banner span {
      font-size: 14px;
      color: var(--text-soft);
      position: relative;
      z-index: 1;
    }

    .rank-banner b {
      font-size: 20px;
      color: white;
      position: relative;
      z-index: 1;
    }

    .leaderboard-list {
      max-height: 45vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .leaderboard-list::-webkit-scrollbar {
      width: 6px;
    }

    .leaderboard-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.18);
      border-radius: 999px;
    }

    .player {
      display: grid;
      grid-template-columns: 52px 1fr 45px 30px;
      align-items: center;
      gap: 12px;
      padding: 11px 6px;
      border-radius: 18px;
      transition: .15s;
      background: rgba(255,255,255,.025);
      border: 1px solid rgba(255,255,255,.055);
      margin-bottom: 8px;
      backdrop-filter: blur(10px);
    }

    .player.top1 {
      border-color: rgba(255,255,255,.28);
      background: linear-gradient(90deg, rgba(255,255,255,.10), rgba(255,255,255,.025));
    }

    .player.top2 {
      border-color: rgba(255,255,255,.18);
    }

    .player.top3 {
      border-color: rgba(255,255,255,.14);
    }

    .player:hover {
      background: rgba(255,255,255,.09);
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
      transform: translateY(-1px);
    }

    .mini-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #020617, #1f2937, #4b5563);
      font-weight: 900;
      border: 2px solid var(--border);
      filter: grayscale(1);
    }

    .name {
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .sub {
      margin-top: 3px;
      font-size: 11px;
      color: rgba(255,255,255,.42);
    }

    .score {
      text-align: right;
      font-size: 18px;
      font-weight: 900;
      color: var(--silver);
      transition: .2s;
    }

    .player:hover .score {
      text-shadow: 0 0 10px rgba(255,255,255,.4);
    }

    .trend {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.08);
      color: var(--silver);
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: rgba(255,255,255,.55);
      padding: 36px 10px;
    }

    @media (max-width: 480px) {
      body { padding: 0; }

      .phone-board {
        max-width: none;
        min-height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>
  <div class="phone-board">
    <div class="topbar">
      <div class="logo-wrap">
        <img class="gang-logo" src="gang-logo.png" alt="Gang Logo" />
        <div class="brand">GIFTED</div>
      </div>

      <div class="coin">คะแนน <span id="totalScore">0</span></div>
    </div>

    <div class="hero-title">
      <h1>Leaderboard</h1>
      <a href="admin.html">Admin</a>
    </div>

    <div class="search-box">
      <input id="searchInput" placeholder="🔍 ค้นหาชื่อ..." oninput="render()" />
    </div>

    <div id="podium" class="podium"></div>

    <div class="rank-banner">
      <span>จำนวนผู้เล่นทั้งหมด</span>
      <b id="totalPlayers">0</b>
    </div>

    <div id="list" class="leaderboard-list"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxuf93a0mwC0gAf5xboU1_4Nk6WoBoREZIh40OqP7guGDpDykBUJIdFvcCpZAtXEucdpg/exec";

    let players = [];
    let isLoading = false;

    function makeId() {
      return "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
    }

    function normalizePlayers(list) {
      return list
        .filter(p => p && typeof p.name === "string")
        .map(p => ({
          id: String(p.id || makeId()),
          name: p.name.trim(),
          score: Number.isFinite(Number(p.score)) ? Number(p.score) : 0
        }))
        .filter(p => p.name.length > 0);
    }

    async function loadPlayers(silent = false) {
      try {
        if (!silent) {
          isLoading = true;
          render();
        }

        const res = await fetch(API_URL + "?t=" + Date.now());
        const data = await res.json();

        if (!data.ok) throw new Error(data.error || "โหลดข้อมูลไม่สำเร็จ");

        players = normalizePlayers(data.players || []);
        localStorage.setItem("gifted_players_backup", JSON.stringify(players));
      } catch (err) {
        const backup = JSON.parse(localStorage.getItem("gifted_players_backup") || "[]");

        if (backup.length) {
          players = normalizePlayers(backup);
        } else {
          document.getElementById("list").innerHTML =
            `<div class="empty">โหลดข้อมูลไม่สำเร็จ: ${escapeHtml(err.message)}</div>`;
        }
      } finally {
        isLoading = false;
        render();
      }
    }

    function sortPlayers() {
      players.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
    }

    function renderPodium(sorted) {
      const podium = document.getElementById("podium");

      if (sorted.length === 0) {
        podium.innerHTML = "";
        return;
      }

      const first = sorted[0];
      const second = sorted[1];
      const third = sorted[2];

      podium.innerHTML = `
        ${second ? podiumCard(second, 2, false) : `<div></div>`}
        ${first ? podiumCard(first, 1, true) : `<div></div>`}
        ${third ? podiumCard(third, 3, false) : `<div></div>`}
      `;
    }

    function podiumCard(player, rank, isTop) {
      return `
        <div class="podium-card ${isTop ? "top" : ""}">
          <div class="avatar">
            ${isTop ? `<div class="crown">👑</div>` : ""}
            👤
            <div class="badge">${rank}</div>
          </div>
          <div class="podium-name">${escapeHtml(player.name)}</div>
          <div class="podium-score">${player.score}</div>
        </div>
      `;
    }

    function render() {
      sortPlayers();

      const totalScore = players.reduce((sum, p) => sum + p.score, 0);
      document.getElementById("totalPlayers").textContent = players.length;
      document.getElementById("totalScore").textContent = totalScore;

      const list = document.getElementById("list");
      const keyword = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();

      const sorted = [...players].sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
      renderPodium(sorted);

      const filteredPlayers = sorted.filter(p =>
        !keyword || p.name.toLowerCase().includes(keyword)
      );

      list.innerHTML = "";

      if (isLoading) {
        list.innerHTML = `<div class="empty">กำลังโหลดข้อมูลจาก Google Sheet...</div>`;
        return;
      }

      if (players.length === 0) {
        list.innerHTML = `<div class="empty">ยังไม่มีรายชื่อ</div>`;
        return;
      }

      if (filteredPlayers.length === 0) {
        list.innerHTML = `<div class="empty">ไม่เจอรายชื่อที่ค้นหา</div>`;
        return;
      }

      filteredPlayers.forEach((p) => {
        const rank = sorted.findIndex(player => player.id === p.id) + 1;

        const topClass =
          rank === 1 ? "top1" :
          rank === 2 ? "top2" :
          rank === 3 ? "top3" : "";

        const arrow = rank <= 3 ? "▲" : "●";

        list.innerHTML += `
          <div class="player ${topClass}">
            <div class="mini-avatar">👤</div>
            <div>
              <div class="name">${escapeHtml(p.name)}</div>
              <div class="sub">Rank #${rank}</div>
            </div>
            <div class="score">${p.score}</div>
            <div class="trend">${arrow}</div>
          </div>
        `;
      });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    render();
    loadPlayers();

    setInterval(() => {
      if (!isLoading && !document.hidden) loadPlayers(true);
    }, 120000);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && !isLoading) loadPlayers(true);
    });
  </script>
</body>
</html>
